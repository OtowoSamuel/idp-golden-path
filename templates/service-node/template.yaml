apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: service-node
  title: Create Node.js Service
  description: Golden-path Node.js service with signed CI, OTel hooks, and GitOps manifests
  tags:
    - node
    - golden-path
    - signed
spec:
  owner: group:default/platform
  type: service

  parameters:
    - title: Service details
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service name
          type: string
          description: Unique name of the service and its repository (lowercase, hyphens)
          maxLength: 40
          pattern: '^[a-z][a-z0-9-]{2,39}$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What does this service do?
        owner:
          title: Owner
          type: string
          description: Team that owns this service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: Repository location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Render golden-path skeleton
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: ./source
        values:
          service_name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          team_label: ${{ (parameters.owner | parseEntityRef).name }}

    - id: publish
      name: Create GitHub repository
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private
        sourcePath: ./source

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Pipeline
        url: ${{ steps.publish.output.remoteUrl }}/actions
